# xcodegen 프로젝트 정의. pbxproj 직접 수정 금지 — 여기 고치고 `xcodegen generate`.
# 이 파일과 App/ 디렉토리는 S1/S6 세션만 수정한다 (CLAUDE.md 소유권 규칙).
name: Gyeop
options:
  bundleIdPrefix: com.gyeop
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: M63YMWAA5V

packages:
  GyeopPackages:
    path: Packages/GyeopPackages
targets:
  Gyeop:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: GyeopPackages
        products: [Core, DesignSystem, CardKit, GyeopKit, DataKit]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gyeop.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: App/Support/Gyeop.entitlements
    info:
      path: App/Support/Info.plist
      properties:
        CFBundleDisplayName: 겹
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "5"   # TestFlight 업로드마다 +1
        UILaunchScreen: {}
        # MPC 로컬 네트워크 권한 (실기기 맞대기) — 서비스명은 GyeopKit ExchangeConstants.serviceType
        NSLocalNetworkUsageDescription: 근처 상대와 아이폰을 맞대 카드를 교환하려면 로컬 네트워크 접근이 필요합니다.
        NSBonjourServices: [_gyeop-exchange._tcp, _gyeop-exchange._udp]
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]

  GyeopUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Gyeop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gyeop.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Gyeop

schemes:
  Gyeop:
    build:
      targets:
        Gyeop: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GyeopUITests
