# xcodegen 프로젝트 정의. pbxproj 직접 수정 금지 — 여기 고치고 `xcodegen generate`.
# 이 파일과 App/ 디렉토리는 S1/S6 세션만 수정한다 (CLAUDE.md 소유권 규칙).
name: Gyeop
options:
  bundleIdPrefix: com.gyeop
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    CODE_SIGN_STYLE: Automatic

packages:
  GyeopPackages:
    path: Packages/GyeopPackages
  AppClipKit:
    path: AppClip/AppClipKit

targets:
  Gyeop:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: GyeopPackages
        products: [Core, DesignSystem, CardKit, GyeopKit, DataKit]
      - target: GyeopClip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gyeop.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: App/Support/Gyeop.entitlements
    info:
      path: App/Support/Info.plist
      properties:
        CFBundleDisplayName: 겹
        UILaunchScreen: {}
        # MPC 로컬 네트워크 권한 (실기기 맞대기) — 서비스명은 GyeopKit ExchangeConstants.serviceType
        NSLocalNetworkUsageDescription: 근처 러너와 아이폰을 맞대 카드를 교환하려면 로컬 네트워크 접근이 필요합니다.
        NSBonjourServices: [_gyeop-exchange._tcp, _gyeop-exchange._udp]
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]

  GyeopUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Gyeop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gyeop.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Gyeop

  # AppClip — 도메인은 자리 표시(PLACEHOLDER.gyeop.example), 실도메인 확정 시 entitlements 교체
  GyeopClip:
    type: application.on-demand-install-capable
    platform: iOS
    sources: [AppClip/App]
    dependencies:
      - package: GyeopPackages
        products: [Core, DesignSystem, CardKit]
      - package: AppClipKit
        products: [AppClipKit]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gyeop.app.Clip
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: AppClip/App/AppClip.entitlements
    info:
      path: AppClip/App/Info.plist
      properties:
        CFBundleDisplayName: 겹 클립
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppClip:
          NSAppClipRequestEphemeralUserNotification: false
          NSAppClipRequestLocationConfirmation: false

schemes:
  Gyeop:
    build:
      targets:
        Gyeop: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GyeopUITests

  # 시뮬레이터에서 클립 경험 확인용 — _XCAppClipURL로 인보케이션 URL 주입
  # (실도메인 확정 전에는 자리 표시 도메인 URL로 파서 경로만 검증)
  GyeopClip:
    build:
      targets:
        GyeopClip: all
    run:
      config: Debug
      environmentVariables:
        - variable: _XCAppClipURL
          value: https://PLACEHOLDER.gyeop.example/clip?inviter=demo-runner
          isEnabled: true
