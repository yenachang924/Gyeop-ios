      <stop offset="0%" stop-color="#E8A54B"/><stop offset="55%" stop-color="#E06A5A"/><stop offset="100%" stop-color="#8F5AB0"/>
    </linearGradient>
  </defs>
  <g font-family="-apple-system, 'SF Pro Text', 'Apple SD Gothic Neo', sans-serif">
    <rect width="393" height="852" fill="#F2F2F7"/>
