<svg width="393" height="852" viewBox="0 0 393 852" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gyou" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8A54B"/><stop offset="55%" stop-color="#E06A5A"/><stop offset="100%" stop-color="#8F5AB0"/>
    </linearGradient>
  </defs>
  <g font-family="-apple-system, 'SF Pro Text', 'Apple SD Gothic Neo', sans-serif">
    <rect width="393" height="852" fill="#F2F2F7"/>
    <text x="38" y="33" font-size="15" font-weight="600" fill="#111114">9:41</text>
    <rect x="132.5" y="12" width="128" height="36" rx="18" fill="#0B0B0D"/>
    <rect x="325" y="22" width="25" height="13" rx="4" stroke="#111114" stroke-width="1.2"/>
