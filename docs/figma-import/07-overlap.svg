    <!-- title -->
    <text x="24" y="122" font-size="26" font-weight="800" fill="#111114" letter-spacing="-0.5">러닝·커피가 겹쳐요</text>
    <text x="24" y="150" font-size="13" fill="#6C6C72">여기서 대화를 시작하세요 — 앱이 아니라, 지금 눈앞의 사람과.</text>
    <!-- overlap banner -->
    <rect x="24" y="182" width="345" height="152" rx="16" fill="#FFFFFF" stroke="#E3E3E8"/>
    <text x="44" y="212" font-size="11" font-weight="800" fill="#66783A" letter-spacing="0.6">겹치는 관심사</text>
