    <rect x="44" y="226" width="58" height="30" rx="15" fill="#E1E7CC" stroke="#C6D19E"/>
    <rect x="110" y="226" width="58" height="30" rx="15" fill="#E1E7CC" stroke="#C6D19E"/>
    <!-- dim chips -->
