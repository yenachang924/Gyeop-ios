    <rect x="242" y="226" width="58" height="30" rx="15" fill="none" stroke="#E3E3E8"/>
    <rect x="308" y="226" width="52" height="30" rx="15" fill="none" stroke="#E3E3E8"/>
    <g font-size="12.5" text-anchor="middle">
      <text x="73" y="246" font-weight="700" fill="#45521F">러닝</text>
      <text x="139" y="246" font-weight="700" fill="#45521F">커피</text>
      <text x="205" y="246" fill="#B4B4BC">전시</text>
      <text x="271" y="246" fill="#B4B4BC">캠핑</text>
      <text x="334" y="246" fill="#B4B4BC">요리</text>
    </g>
    <text x="44" y="292" font-size="12" fill="#6C6C72">“러닝 좋아하세요? 저도요” —</text>
    <text x="44" y="310" font-size="12" fill="#6C6C72">첫 마디는 이미 준비됐어요.</text>
    <!-- received jisu card -->
    <rect x="24" y="358" width="345" height="160" rx="18" fill="url(#gyou)"/>
    <text x="46" y="398" font-size="17" font-weight="800" fill="#FFFFFF">지수</text>
    <text x="46" y="420" font-size="12" fill="#FFFFFF" opacity="0.92">주말마다 새로운 원두를 찾아다녀요</text>
    <g>
      <rect x="46" y="470" width="46" height="24" rx="12" fill="#FFFFFF" opacity="0.92"/>
      <rect x="100" y="470" width="46" height="24" rx="12" fill="#FFFFFF" opacity="0.92"/>
