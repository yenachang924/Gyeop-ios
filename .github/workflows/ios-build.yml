name: iOS Build

on:
  push:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then echo "::error::Xcode 26 not found on runner"; ls /Applications | grep Xcode; exit 1; fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Build (simulator, no signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Gyeop.xcodeproj \
            -scheme Gyeop \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | tail -100

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Gyeop.xcodeproj \
            -scheme Gyeop \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            CODE_SIGNING_ALLOWED=NO \
            | tail -100
        continue-on-error: true
